<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your Turn!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #fff;
      width: 320px;
      height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      user-select: none;
      overflow: hidden;
    }

    .pulse {
      font-size: 52px;
      animation: pulse 0.8s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1);   filter: brightness(1); }
      to   { transform: scale(1.15); filter: brightness(1.4); }
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #f0c040;
      text-shadow: 0 0 18px #f0c04088;
    }

    button {
      padding: 8px 32px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      background: #f0c040;
      color: #1a1a2e;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover { background: #ffd966; }
  </style>
</head>
<body>
  <div class="pulse">♞</div>
  <h1>YOUR TURN!</h1>
  <button>Got it</button>
  <script src="alert.js"></script>
</body>
</html>
