<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your Turn!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #fff;
      width: 220px;
      height: 130px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      user-select: none;
      overflow: hidden;
    }
    .pulse {
      font-size: 40px;
      animation: pulse 0.8s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1);    filter: brightness(1); }
      to   { transform: scale(1.15); filter: brightness(1.4); }
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #f0c040;
      text-shadow: 0 0 14px #f0c04088;
    }
  </style>
</head>
<body>
  <div class="pulse">♞</div>
  <h1>YOUR TURN!</h1>
  <script src="alert.js"></script>
</body>
</html>
